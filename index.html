<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر الساعات</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      margin: 0;
      background-color: #f9f9f9;
      color: #333;
    }
    header {
      background-color: #111;
      color: #fff;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      margin: 0;
      font-size: 20px;
    }
    .admin-btn {
      background-color: #d4af37;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    .container {
      padding: 15px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .product-card {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    .product-card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
    }
    .product-card h3 {
      font-size: 15px;
      margin: 10px 0 5px;
    }
    .product-card p {
      color: #d4af37;
      font-weight: bold;
      margin: 0 0 10px;
    }
    .buy-btn {
      background-color: #111;
      color: #fff;
      border: none;
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <h1>متجر الساعات</h1>
    <button class="admin-btn" onclick="goToLogin()">تسجيل الدخول</button>
  </header>

  <div class="container">
    <h2>أحدث الساعات</h2>
    <div class="products-grid" id="productsGrid">
      <!-- المنتجات ستعرض هنا ديناميكياً -->
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="ساعة">
        <h3>ساعة كلاسيكية</h3>
        <p>500 درهم</p>
        <button class="buy-btn">اطلب الان</button>
      </div>
      <div class="product-card">
        <img src="https://via.placeholder.com/150" alt="ساعة">
        <h3>ساعة رياضية</h3>
        <p>750 درهم</p>
        <button class="buy-btn">اطلب الان</button>
      </div>
    </div>
  </div>

  <script>
    function goToLogin() {
      // هنا سنقوم لاحقاً بربط نافذة تسجيل الدخول
      alert("الانتقال إلى صفحة تسجيل الدخول");
    }
  </script>

</body>
</html>
