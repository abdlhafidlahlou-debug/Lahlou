<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lahlou Accessories | متجر الإكسسوارات العصري</title>
  <!-- مكتبة الأيقونات لجلب شعارات التواصل الاجتماعي الأصلية -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary-color: #1a1a1a;
      --accent-color: #d97706;
      --accent-hover: #b45309;
      --bg-color: #f4f6f8;
      --text-color: #333;
    }
    body {
      font-family: Tahoma, sans-serif;
      margin: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    header {
      background-color: var(--primary-color);
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 3px solid var(--accent-color);
    }
    .container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 15px;
    }
    h2 {
      text-align: center;
      color: var(--primary-color);
      margin-bottom: 25px;
    }
    /* شبكة المنتجات */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .product-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }
    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      background-color: #eee;
    }
    .product-title {
      font-size: 16px;
      font-weight: bold;
      margin: 12px 0 8px;
      color: var(--primary-color);
    }
    .product-price {
      font-size: 16px;
      color: var(--accent-color);
      font-weight: bold;
      margin-bottom: 15px;
    }
    .btn-buy {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px;
      width: 100%;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-buy:hover {
      background-color: var(--accent-hover);
    }

    /* قسم تذييل الصفحة (Footer) وروابط التواصل الاجتماعي الأصلية */
    footer {
      background-color: var(--primary-color);
      color: #fff;
      text-align: center;
      padding: 30px 15px;
      margin-top: 50px;
    }
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }
    .social-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 45px;
      height: 45px;
      background: #252525;
      border-radius: 50%;
      color: #fff;
      font-size: 20px;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }
    .social-icon:hover {
      transform: scale(1.1);
    }
    /* الألوان الأصلية لمواقع التواصل عند المرور أو بشكل دائم */
    .social-icon.whatsapp { color: #25D366; }
    .social-icon.facebook { color: #1877F2; }
    .social-icon.instagram { color: #E4405F; }

    .copyright {
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>

  <header>
    Lahlou Accessories 💍✨
  </header>

  <div class="container">
    <h2>أحدث التشكيلات العصرية</h2>
    
    <!-- حاوية المنتجات التي يتم جلبها من قاعدة البيانات -->
    <div id="products-container" class="products-grid">
      <p style="text-align: center; grid-column: 1/-1; color: #777;">جاري تحميل المنتجات...</p>
    </div>
  </div>

  <!-- تذييل الصفحة مع روابط التواصل الاجتماعي والشعارات الأصلية -->
  <footer>
    <div class="social-icons">
      <!-- أيقونة واتساب -->
      <a id="link-wa" href="#" target="_blank" class="social-icon whatsapp" title="واتساب">
        <i class="fab fa-whatsapp"></i>
      </a>
      <!-- أيقونة فيسبوك -->
      <a id="link-fb" href="#" target="_blank" class="social-icon facebook" title="فيسبوك">
        <i class="fab fa-facebook-f"></i>
      </a>
      <!-- أيقونة انستغرام -->
      <a id="link-ig" href="#" target="_blank" class="social-icon instagram" title="انستغرام">
        <i class="fab fa-instagram"></i>
      </a>
    </div>
    <div class="copyright">
      © 2026 Lahlou Accessories — جميع الحقوق محفوظة
    </div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCLe41I2NAkQQ5xcRRFou4vCN7AhNH4NRE",
      authDomain: "lahlou-70ac2.firebaseapp.com",
      projectId: "lahlou-70ac2",
      storageBucket: "lahlou-70ac2.firebasestorage.app",
      messagingSenderId: "1014570891670",
      appId: "1:1014570891670:web:954e2da1b7881bd7d345b7",
      measurementId: "G-PGW6J8WXWT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // دالة جلب وعرض المنتجات بدون أسعار مزيفة أو عبارات مخزون
    async function loadStoreProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "products"));
        const container = document.getElementById('products-container');
        container.innerHTML = '';

        if (querySnapshot.empty) {
          container.innerHTML = '<p style="text-align: center; grid-column: 1/-1; color: #777;">لا توجد منتجات مضافة حالياً.</p>';
          return;
        }

        querySnapshot.forEach((docSnap) => {
          const product = docSnap.data();
          const productId = docSnap.id;

          container.innerHTML += `
            <div class="product-card">
              <div>
                <img src="${product.image || 'https://via.placeholder.com/300'}" alt="${product.name}" class="product-img">
                <div class="product-title">${product.name || 'منتج عصري'}</div>
                <div class="product-price">${product.price || 0} درهم</div>
              </div>
              <button class="btn-buy" onclick="window.location.href='checkout.html?id=${productId}'">اطلب الان</button>
            </div>
          `;
        });
      } catch (e) {
        console.error("Error loading products:", e);
      }
    }

    // جلب روابط وسائل التواصل الاجتماعي المحفوظة من لوحة الأدمن وتطبيقها على الأيقونات
    function loadSocialLinks() {
      const waLink = localStorage.getItem('admin_wa');
      const fbLink = localStorage.getItem('admin_fb');
      const igLink = localStorage.getItem('admin_ig');

      const waElement = document.getElementById('link-wa');
      const fbElement = document.getElementById('link-fb');
      const igElement = document.getElementById('link-ig');

      if (waLink) { waElement.href = waLink; } else { waElement.style.display = 'none'; }
      if (fbLink) { fbElement.href = fbLink; } else { fbElement.style.display = 'none'; }
      if (igLink) { igElement.href = igLink; } else { igElement.style.display = 'none'; }
    }

    window.onload = function() {
      loadStoreProducts();
      loadSocialLinks();
    };
  </script>

</body>
</html>
