<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lahlou | متجر Lahlou</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #fdfdfd; margin: 0; padding: 0; direction: rtl; }
        header { background: #111; color: white; padding: 20px; text-align: center; }
        .products-grid { display: flex; flex-wrap: wrap; justify-content: center; padding: 20px; gap: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; width: 200px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 4px; }
        .price { color: #e44d26; font-weight: bold; margin: 10px 0; }
        .buy-btn { background: #28a745; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; width: 100%; }
        .buy-btn:hover { background: #218838; }
    </style>
</head>
<body>

<header>
    <h1>Lahlou.ma</h1>
    <p>وجهتك الأولى للموضة والأزياء الراقية</p>
</header>

<main>
    <div id="products-container" class="products-grid">
        <p>جاري تحميل المنتجات...</p>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // نفس بيانات مشروع Lahlou الخاصة بك
    const firebaseConfig = {
      apiKey: "AIzaSyCLe41I2NAkQQ5xcRRFou4vCN7AhNH4NRE",
      authDomain: "lahlou-70ac2.firebaseapp.com",
      projectId: "lahlou-70ac2",
      storageBucket: "lahlou-70ac2.firebasestorage.app",
      messagingSenderId: "1014570891670",
      appId: "1:1014570891670:web:954e2da1b7881bd7d345b7",
      measurementId: "G-PGW6J8WXWT"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadProducts() {
        const container = document.getElementById('products-container');
        container.innerHTML = '';
        
        try {
            const querySnapshot = await getDocs(collection(db, "products"));
            if(querySnapshot.empty) {
                container.innerHTML = '<p>لا توجد منتجات مضافة حالياً في المتجر.</p>';
                return;
            }

            querySnapshot.forEach((doc) => {
                const prod = doc.data();
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <img src="${prod.image || 'https://via.placeholder.com/150'}" alt="${prod.name}">
                    <h3>${prod.name}</h3>
                    <div class="price">${prod.price} درهم</div>
                    <button class="buy-btn" onclick="alert('تم إضافة المنتج لسلة الشراء!')">اطلب الآن</button>
                `;
                container.appendChild(card);
            });
        } catch (error) {
            container.innerHTML = '<p>حدث خطأ في تحميل المنتجات.</p>';
        }
    }

    loadProducts();
</script>

</body>
</html>
