<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دلال ستايل | Dalal Style</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --wine:#5C1F2E; --wine-dark:#3A1119; --wine-soft:#7A3145;
  --rose:#E3B6BC; --rose-light:#F6E6E8;
  --gold:#B8912F; --gold-light:#D9BE73; --gold-dim:#EFE3C4;
  --ivory:#FBF6F1; --ivory-2:#F4ECE4;
  --ink:#2A1E22; --ink-soft:#7A6A6E;
  --success:#3F6B4E; --success-bg:#E8F0E9;
  --danger:#A23B3B; --danger-bg:#F7E9E9;
  --warn:#9C7A22; --warn-bg:#FAF1DC;
  --radius:14px;
  --shadow:0 10px 30px rgba(58,17,25,.10);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Cairo',sans-serif;
  background:var(--ivory);
  color:var(--ink);
  line-height:1.6;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Aref Ruqaa',serif;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer; border:none;}
img{max-width:100%; display:block;}
::selection{background:var(--gold-dim);}

.ornament{display:flex; align-items:center; gap:10px; justify-content:center; color:var(--gold); opacity:.85;}
.ornament::before,.ornament::after{content:""; height:1px; width:40px; background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.ornament span{font-size:18px;}

/* Top bar */
.topbar{background:var(--wine); color:var(--gold-light); text-align:center; font-size:13px; padding:7px 10px; letter-spacing:.3px;}

/* Header */
header.site{
  background:var(--ivory); position:sticky; top:0; z-index:40;
  border-bottom:1px solid rgba(184,145,47,.25);
  box-shadow:0 2px 12px rgba(58,17,25,.04);
}
.header-inner{
  max-width:1200px; margin:0 auto; padding:14px 20px;
  display:flex; align-items:center; gap:18px; justify-content:space-between; flex-wrap:wrap;
}
.logo{display:flex; flex-direction:column; align-items:flex-start; gap:0; cursor:pointer;}
.logo .ar{font-size:26px; color:var(--wine); font-weight:700;}
.logo .en{font-size:10px; letter-spacing:3px; color:var(--gold); text-transform:uppercase;}
nav.main-nav{display:flex; gap:22px; flex-wrap:wrap;}
nav.main-nav button{
  background:none; color:var(--ink); font-size:15px; padding:6px 2px; position:relative; font-weight:600;
}
nav.main-nav button.active{color:var(--wine);}
nav.main-nav button.active::after{content:""; position:absolute; right:0; left:0; bottom:-4px; height:2px; background:var(--gold);}
.header-actions{display:flex; align-items:center; gap:14px;}
.search-box{
  display:flex; align-items:center; background:var(--ivory-2); border-radius:30px; padding:6px 14px; gap:8px;
  border:1px solid rgba(184,145,47,.2); min-width:180px;
}
.search-box input{background:none; border:none; outline:none; font-family:inherit; font-size:14px; width:100%; color:var(--ink);}
.icon-btn{
  position:relative; background:none; width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--wine); font-size:19px; transition:.2s;
}
.icon-btn:hover{background:var(--rose-light);}
.badge-count{
  position:absolute; top:-2px; left:-2px; background:var(--wine); color:#fff; font-size:10px; min-width:16px; height:16px;
  border-radius:50%; display:flex; align-items:center; justify-content:center; padding:0 3px;
}
.admin-link{font-size:12px; color:var(--ink-soft); border:1px solid rgba(122,90,94,.3); padding:6px 12px; border-radius:20px;}
.admin-link:hover{border-color:var(--wine); color:var(--wine);}

/* Hero */
.hero{
  position:relative; overflow:hidden; background:linear-gradient(135deg,var(--wine-dark),var(--wine) 60%,var(--wine-soft));
  color:var(--ivory); padding:70px 20px 90px;
}
.hero-inner{max-width:1200px; margin:0 auto; display:flex; align-items:center; gap:50px; flex-wrap:wrap;}
.hero-text{flex:1 1 380px;}
.hero-eyebrow{color:var(--gold-light); letter-spacing:4px; font-size:12px; text-transform:uppercase; margin-bottom:14px; display:block;}
.hero-title{font-size:46px; line-height:1.3; margin-bottom:18px;}
.hero-title em{color:var(--gold-light); font-style:normal;}
.hero-sub{font-size:16px; color:rgba(251,246,241,.85); max-width:440px; margin-bottom:28px;}
.hero-cta{display:flex; gap:14px; flex-wrap:wrap;}
.btn{
  padding:13px 28px; border-radius:30px; font-weight:700; font-size:14px; transition:.25s; display:inline-flex; align-items:center; gap:8px;
}
.btn-gold{background:var(--gold); color:var(--wine-dark);}
.btn-gold:hover{background:var(--gold-light);}
.btn-outline{border:1.5px solid var(--gold-light); color:var(--ivory); background:none;}
.btn-outline:hover{background:rgba(255,255,255,.08);}
.btn-wine{background:var(--wine); color:#fff;}
.btn-wine:hover{background:var(--wine-dark);}
.btn-ghost{background:var(--ivory-2); color:var(--ink);}
.btn-ghost:hover{background:var(--rose-light);}
.btn-danger{background:var(--danger-bg); color:var(--danger);}
.btn-sm{padding:8px 16px; font-size:12.5px; border-radius:20px;}
.hero-visual{
  flex:1 1 300px; display:flex; justify-content:center; align-items:center; position:relative; min-height:280px;
}
.hero-frame{
  width:230px; height:300px; border:1.5px solid var(--gold-light); border-radius:4px 60px 4px 60px; overflow:hidden;
  position:relative; box-shadow:var(--shadow); transform:rotate(-3deg);
}
.hero-frame img{width:100%; height:100%; object-fit:cover;}
.hero-frame2{
  width:180px; height:230px; position:absolute; left:0; bottom:-30px; border-radius:60px 4px 60px 4px; overflow:hidden;
  border:1.5px solid var(--gold-light); transform:rotate(6deg); box-shadow:var(--shadow);
}
.hero-frame2 img{width:100%; height:100%; object-fit:cover;}
.hero-wave{position:absolute; bottom:-2px; right:0; left:0; height:60px; background:var(--ivory); border-radius:60% 60% 0 0/100% 100% 0 0;}

/* Categories strip */
.cats-strip{max-width:1200px; margin:-40px auto 40px; padding:0 20px; position:relative; z-index:5;}
.cats-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px;}
.cat-card{
  background:#fff; border-radius:var(--radius); padding:18px; text-align:center; box-shadow:var(--shadow);
  border:1px solid rgba(184,145,47,.12); transition:.2s;
}
.cat-card:hover{transform:translateY(-4px); border-color:var(--gold);}
.cat-card .em{font-size:26px; margin-bottom:8px; display:block;}
.cat-card .name{font-weight:700; font-size:14px; color:var(--wine);}

/* Layout / storefront */
.container{max-width:1200px; margin:0 auto; padding:0 20px 60px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:36px 0 20px;}
.section-title h2{font-size:26px; color:var(--wine);}
.store-layout{display:grid; grid-template-columns:260px 1fr; gap:28px; align-items:start;}
.filters{
  background:#fff; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); position:sticky; top:90px;
  border:1px solid rgba(184,145,47,.12);
}
.filters h3{font-size:15px; color:var(--wine); margin-bottom:12px; display:flex; align-items:center; gap:6px;}
.filter-group{margin-bottom:20px; padding-bottom:18px; border-bottom:1px dashed rgba(122,90,94,.2);}
.filter-group:last-child{border:none; margin-bottom:0;}
.filter-group label.title{font-size:12.5px; font-weight:700; color:var(--ink-soft); display:block; margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px;}
.chip-row{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  padding:6px 13px; border-radius:20px; font-size:12.5px; background:var(--ivory-2); border:1px solid transparent; color:var(--ink);
}
.chip.active{background:var(--wine); color:#fff;}
.color-dot{width:22px; height:22px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.15); cursor:pointer;}
.color-dot.active{box-shadow:0 0 0 2px var(--gold);}
.range-row{display:flex; gap:8px;}
.range-row input{width:100%; padding:8px 10px; border-radius:8px; border:1px solid rgba(122,90,94,.25); font-family:inherit; font-size:13px;}
.clear-filters{font-size:12px; color:var(--wine); text-decoration:underline; margin-top:6px; background:none;}

.products-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:22px;}
.pcard{
  background:#fff; border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); border:1px solid rgba(184,145,47,.10);
  transition:.25s; display:flex; flex-direction:column;
}
.pcard:hover{transform:translateY(-5px); box-shadow:0 16px 34px rgba(58,17,25,.14);}
.pcard .imgwrap{position:relative; aspect-ratio:4/5; overflow:hidden; cursor:pointer;}
.pcard .imgwrap img{width:100%; height:100%; object-fit:cover; transition:.4s;}
.pcard:hover .imgwrap img{transform:scale(1.06);}
.pcard .cat-tag{position:absolute; top:10px; right:10px; background:rgba(251,246,241,.92); color:var(--wine); font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700;}
.stock-tag{position:absolute; top:10px; left:10px; background:var(--danger-bg); color:var(--danger); font-size:11px; padding:4px 10px; border-radius:20px; font-weight:700;}
.pcard .body{padding:14px 16px 18px; display:flex; flex-direction:column; gap:8px; flex:1;}
.pcard .name{font-weight:700; font-size:15px; color:var(--ink); cursor:pointer;}
.pcard .occasion{font-size:12px; color:var(--ink-soft);}
.pcard .price-row{display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:8px;}
.pcard .price{color:var(--wine); font-weight:800; font-size:17px;}
.pcard .add-btn{background:var(--gold); color:var(--wine-dark); width:38px; height:38px; border-radius:50%; font-size:16px; display:flex; align-items:center; justify-content:center;}
.pcard .add-btn:hover{background:var(--gold-light);}
.empty-state{text-align:center; padding:60px 20px; color:var(--ink-soft);}
.empty-state .em{font-size:40px; display:block; margin-bottom:10px;}

/* Modals */
.overlay{position:fixed; inset:0; background:rgba(42,30,34,.55); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px; backdrop-filter:blur(2px);}
.modal{background:#fff; border-radius:16px; max-width:560px; width:100%; max-height:88vh; overflow-y:auto; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal.modal-lg{max-width:840px;}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--ivory-2); position:sticky; top:0; background:#fff; z-index:2;}
.modal-head h3{color:var(--wine); font-size:20px;}
.modal-close{background:var(--ivory-2); width:32px; height:32px; border-radius:50%; font-size:16px; color:var(--ink-soft);}
.modal-body{padding:22px;}
.pd-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
.pd-grid img{border-radius:12px; width:100%; aspect-ratio:4/5; object-fit:cover;}
.pd-price{color:var(--wine); font-size:24px; font-weight:800; margin:10px 0;}
.pd-desc{color:var(--ink-soft); font-size:14px; margin-bottom:14px;}
.option-row{margin-bottom:16px;}
.option-row .title{font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:8px; display:flex; justify-content:space-between;}
.size-guide-link{color:var(--wine); text-decoration:underline; font-size:12px; font-weight:400; cursor:pointer;}
.qty-box{display:flex; align-items:center; gap:10px; border:1px solid rgba(122,90,94,.25); border-radius:10px; width:fit-content;}
.qty-box button{width:34px; height:34px; background:var(--ivory-2); font-size:16px;}
.qty-box span{width:30px; text-align:center; font-weight:700;}

/* Form elements */
.form-group{margin-bottom:16px;}
.form-group label{display:block; font-size:13px; font-weight:700; color:var(--ink-soft); margin-bottom:6px;}
.form-group input,.form-group select,.form-group textarea{
  width:100%; padding:11px 14px; border-radius:10px; border:1px solid rgba(122,90,94,.25); font-family:inherit; font-size:14px; background:var(--ivory-2);
}
.form-group textarea{min-height:80px; resize:vertical;}
.form-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.hint{font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
.err{color:var(--danger); font-size:12.5px; margin-top:4px;}

/* Cart drawer */
.drawer-overlay{position:fixed; inset:0; background:rgba(42,30,34,.5); z-index:100;}
.drawer{position:fixed; top:0; left:0; height:100%; width:400px; max-width:92vw; background:#fff; z-index:101; box-shadow:8px 0 30px rgba(0,0,0,.2); display:flex; flex-direction:column; animation:slideIn .25s ease;}
@keyframes slideIn{from{transform:translateX(-100%);} to{transform:translateX(0);}}
.drawer-head{padding:18px 20px; border-bottom:1px solid var(--ivory-2); display:flex; justify-content:space-between; align-items:center;}
.drawer-body{flex:1; overflow-y:auto; padding:16px 20px;}
.cart-item{display:flex; gap:12px; padding:14px 0; border-bottom:1px solid var(--ivory-2);}
.cart-item img{width:64px; height:80px; object-fit:cover; border-radius:8px;}
.cart-item .info{flex:1;}
.cart-item .name{font-weight:700; font-size:14px;}
.cart-item .meta{font-size:12px; color:var(--ink-soft); margin:3px 0;}
.cart-item .row2{display:flex; align-items:center; justify-content:space-between; margin-top:6px;}
.remove-link{font-size:12px; color:var(--danger); background:none;}
.drawer-foot{padding:18px 20px; border-top:1px solid var(--ivory-2);}
.sum-row{display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; color:var(--ink-soft);}
.sum-row.total{font-weight:800; font-size:17px; color:var(--wine); margin-top:10px;}
.coupon-row{display:flex; gap:8px; margin-bottom:14px;}
.coupon-row input{flex:1; padding:9px 12px; border-radius:8px; border:1px solid rgba(122,90,94,.25); font-family:inherit;}

/* Size guide table */
table{width:100%; border-collapse:collapse; font-size:13px;}
table th,table td{padding:9px 10px; text-align:center; border-bottom:1px solid var(--ivory-2);}
table th{background:var(--ivory-2); color:var(--wine); font-weight:700;}

/* Order tracking */
.track-box{max-width:560px; margin:0 auto; background:#fff; border-radius:var(--radius); padding:30px; box-shadow:var(--shadow); border:1px solid rgba(184,145,47,.12);}
.timeline{display:flex; justify-content:space-between; margin:30px 0 10px; position:relative;}
.timeline::before{content:""; position:absolute; top:16px; right:8%; left:8%; height:2px; background:var(--ivory-2); z-index:0;}
.tstep{flex:1; text-align:center; position:relative; z-index:1;}
.tstep .dot{width:34px; height:34px; border-radius:50%; background:var(--ivory-2); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; margin:0 auto 8px; font-size:15px; border:2px solid var(--ivory-2);}
.tstep.done .dot{background:var(--success); color:#fff; border-color:var(--success);}
.tstep.current .dot{background:var(--gold); color:#fff; border-color:var(--gold);}
.tstep .label{font-size:12px; color:var(--ink-soft);}
.order-summary-line{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px dashed var(--ivory-2); font-size:14px;}

/* Admin */
.admin-shell{display:flex; min-height:calc(100vh - 0px);}
.admin-side{
  width:230px; background:var(--wine-dark); color:var(--ivory); padding:26px 0; flex-shrink:0; min-height:100vh;
}
.admin-side .brand{padding:0 22px 26px; border-bottom:1px solid rgba(255,255,255,.1); margin-bottom:16px;}
.admin-side .brand .ar{font-family:'Aref Ruqaa',serif; font-size:22px; color:var(--gold-light);}
.admin-side .brand .role{font-size:11px; color:rgba(251,246,241,.6); letter-spacing:2px; text-transform:uppercase;}
.admin-nav-item{
  display:flex; align-items:center; gap:10px; padding:13px 22px; font-size:14px; color:rgba(251,246,241,.75); cursor:pointer; border-right:3px solid transparent;
}
.admin-nav-item:hover{background:rgba(255,255,255,.05);}
.admin-nav-item.active{background:rgba(255,255,255,.08); color:#fff; border-right-color:var(--gold);}
.admin-main{flex:1; padding:30px 34px; background:var(--ivory);}
.admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:26px;}
.admin-topbar h2{color:var(--wine); font-size:26px;}
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:18px; margin-bottom:28px;}
.stat-card{background:#fff; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); border:1px solid rgba(184,145,47,.1);}
.stat-card .label{font-size:12.5px; color:var(--ink-soft); margin-bottom:8px;}
.stat-card .value{font-size:24px; font-weight:800; color:var(--wine);}
.stat-card .sub{font-size:11.5px; color:var(--success); margin-top:4px;}
.panel{background:#fff; border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); border:1px solid rgba(184,145,47,.1); margin-bottom:22px;}
.panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
.panel-head h3{color:var(--wine); font-size:17px;}
.data-table{width:100%; border-collapse:collapse; font-size:13.5px;}
.data-table th{text-align:right; padding:10px 12px; background:var(--ivory-2); color:var(--ink-soft); font-size:12px; text-transform:uppercase; letter-spacing:.4px;}
.data-table td{padding:11px 12px; border-bottom:1px solid var(--ivory-2); vertical-align:middle;}
.data-table tr:hover td{background:var(--ivory-2);}
.status-pill{padding:4px 12px; border-radius:20px; font-size:11.5px; font-weight:700; display:inline-block;}
.status-processing{background:var(--warn-bg); color:var(--warn);}
.status-shipping{background:#DCE7F5; color:#2E5A9C;}
.status-delivered{background:var(--success-bg); color:var(--success);}
.status-cancelled{background:var(--danger-bg); color:var(--danger);}
.mini-thumb{width:38px; height:48px; object-fit:cover; border-radius:6px;}
.row-flex{display:flex; align-items:center; gap:10px;}
.tabs-inline{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.bar-chart{display:flex; align-items:flex-end; gap:10px; height:140px; padding-top:10px;}
.bar-col{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.bar-col .bar{width:70%; background:linear-gradient(180deg,var(--gold-light),var(--wine)); border-radius:6px 6px 0 0; min-height:3px;}
.bar-col .lbl{font-size:10.5px; color:var(--ink-soft);}
.wallet-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin-bottom:22px;}
.wallet-card{border-radius:var(--radius); padding:22px; color:#fff;}
.wallet-card.balance{background:linear-gradient(135deg,var(--wine-dark),var(--wine));}
.wallet-card.pending{background:linear-gradient(135deg,#8a6a1f,var(--gold));}
.wallet-card.withdrawn{background:linear-gradient(135deg,#3a3a3a,#6b6b6b);}
.wallet-card .label{font-size:12.5px; opacity:.85; margin-bottom:8px;}
.wallet-card .amount{font-size:26px; font-weight:800;}
.empty-row td{text-align:center; color:var(--ink-soft); padding:26px;}
.login-box{max-width:380px; margin:80px auto; background:#fff; padding:32px; border-radius:16px; box-shadow:var(--shadow); text-align:center;}
.login-box .em{font-size:34px; margin-bottom:10px; display:block;}
.toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--wine); color:#fff; padding:13px 26px; border-radius:30px; font-size:14px; z-index:200; box-shadow:var(--shadow); animation:toastIn .25s ease;}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
.notice{background:var(--warn-bg); color:var(--warn); border-radius:10px; padding:12px 16px; font-size:12.5px; margin-bottom:18px;}

footer.site{background:var(--wine-dark); color:rgba(251,246,241,.7); padding:40px 20px 22px; margin-top:60px;}
.footer-inner{max-width:1200px; margin:0 auto; display:flex; justify-content:space-between; flex-wrap:wrap; gap:24px;}
.footer-inner .ar{font-family:'Aref Ruqaa',serif; color:var(--gold-light); font-size:22px; margin-bottom:8px;}
.footer-copy{text-align:center; font-size:12px; color:rgba(251,246,241,.4); margin-top:26px; border-top:1px solid rgba(255,255,255,.08); padding-top:18px; max-width:1200px; margin-inline:auto;}

@media(max-width:860px){
  .store-layout{grid-template-columns:1fr;}
  .products-grid{grid-template-columns:repeat(2,1fr);}
  .cats-grid{grid-template-columns:repeat(2,1fr);}
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .wallet-cards{grid-template-columns:1fr;}
  .admin-shell{flex-direction:column;}
  .admin-side{width:100%; min-height:auto; display:flex; overflow-x:auto; padding:10px;}
  .admin-side .brand{display:none;}
  .admin-nav-item{white-space:nowrap; border-right:none; border-bottom:3px solid transparent;}
  .admin-nav-item.active{border-right:none; border-bottom-color:var(--gold);}
  .pd-grid{grid-template-columns:1fr;}
  nav.main-nav{order:3; width:100%; justify-content:center; padding-top:6px;}
}
@media(max-width:520px){

function playNotifySound(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(); const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880; gain.gain.value = 0.06;
    osc.start(); osc.stop(ctx.currentTime + 0.18);
  }catch(e){}
}
async function checkAdminEmail(user){

/* ============ FIRESTORE (real shared database) ============
   Each entity lives in its own collection so security rules can be
   granular (customers may create orders, but only the authenticated
   admin can edit products/coupons or read the wallet). Realtime
   listeners keep every open tab/device in sync automatically. */
state.data = { products: [], orders: [], coupons: [], wallet: { withdrawn: 0, transactions: [] } };
let seededProducts=false, seededCoupons=false;
let unsubscribers = [];
let knownOrderIds = null;
const ADMIN_LAST_SEEN_KEY = 'dalal-admin-last-seen-orders';
function getLastSeenOrders(){ return Number(localStorage.getItem(ADMIN_LAST_SEEN_KEY)||0); }
function markOrdersSeen(){ localStorage.setItem(ADMIN_LAST_SEEN_KEY, String(Date.now())); }
function newOrdersCount(){ return state.data.orders.filter(o=>(o.createdAt||0) > getLastSeenOrders()).length; }

function loadData(){
  return new Promise((resolve)=>{
    let flags = {products:false, orders:false, coupons:false, wallet:false, meta:false};
    const done = ()=>{ if(Object.values(flags).every(Boolean)) resolve(); };

    unsubscribers.push(db.collection('products').onSnapshot(snap=>{
      state.data.products = snap.docs.map(d=>d.data());
      flags.products=true; done(); render();
    }, ()=>{ flags.products=true; done(); }));

    unsubscribers.push(db.collection('orders').orderBy('createdAt','desc').onSnapshot(snap=>{
      const prevIds = knownOrderIds;
      const newOrders = snap.docs.map(d=>d.data());
      if(prevIds && state.isAdmin){
        const freshOnes = newOrders.filter(o=>!prevIds.has(o.id));
        if(freshOnes.length){ playNotifySound(); showToast(`📦 وصل ${freshOnes.length>1?'طلبات جديدة':'طلب جديد'}!`); }
      }
      knownOrderIds = new Set(newOrders.map(o=>o.id));
      state.data.orders = newOrders;
      flags.orders=true; done(); render();
    }, ()=>{ flags.orders=true; done(); }));

    unsubscribers.push(db.collection('coupons').onSnapshot(snap=>{
      state.data.coupons = snap.docs.map(d=>d.data());
      flags.coupons=true; done(); render();
    }, ()=>{ flags.coupons=true; done(); }));

    unsubscribers.push(db.collection('wallet_transactions').orderBy('createdAt','desc').onSnapshot(snap=>{
      state.data.wallet.transactions = snap.docs.map(d=>d.data());
      flags.wallet=true; done(); render();
    }, ()=>{ flags.wallet=true; done(); }));

    db.collection('meta').doc('wallet').onSnapshot(doc=>{
      state.data.wallet.withdrawn = doc.exists ? (doc.data().withdrawn||0) : 0;
      flags.meta=true; done(); render();
    }, ()=>{ flags.meta=true; done(); });
  });
}
function saveProduct(p){ return db.collection('products').doc(p.id).set(p); }
function deleteProductDoc(id){ return db.collection('products').doc(id).delete(); }
function saveOrder(o){ return db.collection('orders').doc(o.id).set(o); }
function updateOrderStatusDoc(id, status){ return db.collection('orders').doc(id).update({status}); }
function saveCoupon(c){ return db.collection('coupons').doc(c.code).set(c); }
function deleteCouponDoc(code){ return db.collection('coupons').doc(code).delete(); }
function addWalletTx(tx){ return db.collection('wallet_transactions').doc(tx.id).set(tx); }
function setWithdrawn(amount){ return db.collection('meta').doc('wallet').set({withdrawn:amount}, {merge:true}); }

/* ============ HELPERS ============ */
function getProduct(id){ return state.data.products.find(p=>p.id===id); }
function totalStock(p){ return Object.values(p.stock).reduce((a,b)=>a+b,0); }
function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }

/* ============ FILTERING ============ */
function filteredProducts(){
  let list = state.data.products.slice();
  if(state.category) list = list.filter(p=>p.category===state.category);
  if(state.search.trim()) list = list.filter(p=>p.name.includes(state.search.trim()));
  const f = state.filters;
  if(f.colors.length) list = list.filter(p=>p.colors.some(c=>f.colors.includes(c)));
  if(f.sizes.length) list = list.filter(p=>p.sizes.some(s=>f.sizes.includes(s)));
  if(f.occasion) list = list.filter(p=>p.occasion===f.occasion);
  if(f.minPrice) list = list.filter(p=>p.price>=Number(f.minPrice));
  if(f.maxPrice) list = list.filter(p=>p.price<=Number(f.maxPrice));
  return list;
}

  document.getElementById('modal-root').innerHTML = `

    <div class="modal modal-lg" data-stop="1">

            </div>

                <span>${productModalState.qty}</span>

              </div>
            </div>

            <button class="btn btn-wine" style="width:100%; justify-content:center;" data-add-to-cart="${p.id}" ${stockForSize<=0?'disabled':''}>

            </button>

        </div>

    </div>
  </div>`;

}
function attachModalEvents(p){
  const root = document.getElementById('modal-root');
  root.querySelector('[data-close-overlay]').addEventListener('click', closeModal);
  root.querySelector('[data-stop]').addEventListener('click', e=>e.stopPropagation());
  root.querySelector('[data-close-modal]').addEventListener('click', closeModal);
  root.querySelectorAll('[data-pm-color]').forEach(el=>el.addEventListener('click', ()=>{ productModalState.color=el.dataset.pmColor; renderProductModal(p); }));
  root.querySelectorAll('[data-pm-size]').forEach(el=>el.addEventListener('click', ()=>{ productModalState.size=el.dataset.pmSize; productModalState.qty=1; renderProductModal(p); }));
  root.querySelectorAll('[data-pm-qty]').forEach(el=>el.addEventListener('click', ()=>{
    const stock = p.stock[productModalState.size] ?? 0;
    productModalState.qty = Math.min(Math.max(1, productModalState.qty + Number(el.dataset.pmQty)), Math.max(stock,1));
    renderProductModal(p);
  }));
  const sg = root.querySelector('[data-open-sizeguide]');
  if(sg) sg.addEventListener('click', renderSizeGuideModal);
  const addBtn = root.querySelector('[data-add-to-cart]');
  if(addBtn) addBtn.addEventListener('click', ()=>{
    state.cart.push({productId:p.id, size:productModalState.size, color:productModalState.color, qty:productModalState.qty});
    closeModal();
    showToast('تمت الإضافة إلى السلة ✨');
    render();
  });
}

async function placeOrder({name,phone,city,address,payment,subtotal,discount,total}){
  const orderId = uid('ORD');
  const items = state.cart.map(c=>{
    const p=getProduct(c.productId);
    return {productId:c.productId, name:p.name, price:p.price, qty:c.qty, size:c.size, color:c.color};
  });
  const stockUpdates = [];
  items.forEach(it=>{
    const p=getProduct(it.productId);
    if(p && p.stock[it.size]!==undefined){ p.stock[it.size]=Math.max(0,p.stock[it.size]-it.qty); stockUpdates.push(p); }
  });
  const order = {
    id:orderId, date:todayISO(), createdAt:Date.now(), customerName:name, phone, city, address, items,
    subtotal, discount, total, payment, status:'قيد المعالجة'
  };
  try{
    await Promise.all([
      ...stockUpdates.map(p=>saveProduct(p)),
      saveOrder(order),
      addWalletTx({id:uid('TX'), date:todayISO(), createdAt:Date.now(), type:'بيع (معلق)', amount:total, orderId, note:`طلب ${orderId} - بانتظار التسليم`}),
      sendOwnerOrderEmail(order)
    ]);
  }catch(e){
    console.error(e);
    showToast('حدث خطأ أثناء إرسال الطلب، حاولي مجدداً');
    return;
  }
  state.cart = [];
  appliedCoupon = null;
  state.lastOrder = order;
  closeModal();
  showToast('تم تأكيد طلبك بنجاح 🌸');
  state.view='order-confirm';
  render();
}

/* ============ GLOBAL EVENTS (storefront) ============ */
function attachGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click', ()=>{
    const v = el.dataset.nav;
    if(v==='home'){ state.view='home'; state.category=null; state.search=''; }
    else if(v==='home-all'){ state.view='home'; state.category=null; state.search=''; }
    else if(v==='track'){ state.view='track'; }
    else if(v==='admin-login'){ state.view='admin-login'; }
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }));
  document.querySelectorAll('[data-cat]').forEach(el=>el.addEventListener('click', ()=>{
    state.category = el.dataset.cat; state.view='home'; state.search='';
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }));
  const searchInput = document.getElementById('search-input');
  if(searchInput){
    searchInput.addEventListener('input', ()=>{ state.search = searchInput.value; state.category=null; renderPreserveFocus(); });
  }
  document.querySelectorAll('[data-open-product]').forEach(el=>el.addEventListener('click', ()=>openProductModal(el.dataset.openProduct)));
  const cartBtn = document.querySelector('[data-open-cart]');
  if(cartBtn) cartBtn.addEventListener('click', ()=>{ state.cartOpen=true; renderCartDrawer(); });

  document.querySelectorAll('[data-toggle-color]').forEach(el=>el.addEventListener('click', ()=>{
    const c = el.dataset.toggleColor; const arr=state.filters.colors;
    const i=arr.indexOf(c); if(i>-1) arr.splice(i,1); else arr.push(c);
    render();
  }));
  document.querySelectorAll('[data-toggle-size]').forEach(el=>el.addEventListener('click', ()=>{
    const s = el.dataset.toggleSize; const arr=state.filters.sizes;
    const i=arr.indexOf(s); if(i>-1) arr.splice(i,1); else arr.push(s);
    render();
  }));
  const occSel = document.getElementById('filter-occasion');
  if(occSel) occSel.addEventListener('change', ()=>{ state.filters.occasion=occSel.value; render(); });
  const minEl = document.getElementById('filter-min'), maxEl = document.getElementById('filter-max');
  if(minEl) minEl.addEventListener('change', ()=>{ state.filters.minPrice=minEl.value; render(); });
  if(maxEl) maxEl.addEventListener('change', ()=>{ state.filters.maxPrice=maxEl.value; render(); });
  const clearBtn = document.querySelector('[data-clear-filters]');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{ state.filters={colors:[],sizes:[],occasion:'',minPrice:'',maxPrice:''}; render(); });

  const trackSubmit = document.querySelector('[data-track-submit]');
  if(trackSubmit) trackSubmit.addEventListener('click', ()=>{
    trackQuery.orderId = document.getElementById('tk-id').value;
    trackQuery.phone = document.getElementById('tk-phone').value;
    render();
  });

  const adminPasswordSubmit = document.querySelector('[data-admin-password-submit]');
  if(adminPasswordSubmit) adminPasswordSubmit.addEventListener('click', async ()=>{
    const errEl = document.getElementById('admin-err');
    const email = (document.getElementById('admin-email').value || '').trim();
    const password = document.getElementById('admin-password').value || '';
    if(!email || !password){ errEl.textContent = 'الرجاء إدخال البريد الإلكتروني وكلمة السر'; return; }
    try{
      const result = await auth.signInWithEmailAndPassword(email, password);
      await checkAdminEmail(result.user);
    }catch(e){
      console.error(e);
      const messages = {
        'auth/invalid-credential':'البريد الإلكتروني أو كلمة السر غير صحيحة',
        'auth/wrong-password':'كلمة السر غير صحيحة',
        'auth/user-not-found':'لا يوجد حساب بهذا البريد الإلكتروني',
        'auth/invalid-email':'البريد الإلكتروني غير صالح',
        'auth/too-many-requests':'محاولات كثيرة، حاولي بعد قليل'
      };
      errEl.textContent = messages[e.code] || ('تعذر تسجيل الدخول: ' + (e.code || e.message));
    }
  });

  const adminSubmit = document.querySelector('[data-admin-submit]');
  if(adminSubmit) adminSubmit.addEventListener('click', async ()=>{
    const provider = new firebase.auth.GoogleAuthProvider();
    const popupBlockedCodes = ['auth/popup-blocked','auth/cancelled-popup-request','auth/popup-closed-by-user'];
    try{
      const result = await auth.signInWithPopup(provider);
      checkAdminEmail(result.user);
    }catch(e){
      console.error(e);
      if(!popupBlockedCodes.includes(e.code)){
        // خطأ حقيقي في الإعداد (نطاق غير مصرح، مزود غير مفعّل...) — لا فائدة من إعادة المحاولة عبر التوجيه
        document.getElementById('admin-err').textContent = 'تعذر تسجيل الدخول: ' + (e.code || e.message);
        return;
      }
      // النافذة المنبثقة محظورة في متصفح الهاتف — نجربي التوجيه (redirect) بدلها
      try{ await auth.signInWithRedirect(provider); }
      catch(e2){
        console.error(e2);
        const codeText = (e2 && e2.code) ? ` (${e2.code})` : '';
        document.getElementById('admin-err').textContent = 'تعذر تسجيل الدخول، حاولي مجدداً' + codeText;
      }
    }
  });

  if(state.view==='order-confirm'){
    // handled via renderMainView switch below
  }
}
function renderPreserveFocus(){
  const activeVal = document.getElementById('search-input') ? document.getElementById('search-input').value : '';
  const scrollY = window.scrollY;
  render();
  const si = document.getElementById('search-input');
  if(si){ si.focus(); si.value = activeVal; si.setSelectionRange(activeVal.length, activeVal.length); }
  window.scrollTo(0, scrollY);
}

function attachProductFormEvents(p){
  const root = document.getElementById('modal-root');
  root.querySelector('[data-close-overlay]').addEventListener('click', closeModal);
  root.querySelector('[data-stop]').addEventListener('click', e=>e.stopPropagation());
  root.querySelector('[data-close-modal]').addEventListener('click', closeModal);
  let selColors = new Set(p.colors);
  let selSizes = new Set(p.sizes);
  let uploadedImage = (p.images[0]||'').startsWith('data:') ? p.images[0] : null;
  const uploadBtn = root.querySelector('#pf-upload-btn');
  const fileInput = root.querySelector('#pf-image-file');
  const statusEl = root.querySelector('#pf-upload-status');
  const previewWrap = root.querySelector('#pf-image-preview-wrap');
  const previewImg = root.querySelector('#pf-image-preview');
  uploadBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){
      statusEl.textContent = 'الرجاء اختيار ملف صورة صالح';
      return;
    }
    statusEl.textContent = 'جارٍ تجهيز الصورة...';
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 900;
        let w = img.width, h = img.height;
        if(w > h && w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; }
        else if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        uploadedImage = canvas.toDataURL('image/jpeg', 0.72);
        previewImg.src = uploadedImage;
        previewWrap.style.display = '';
        statusEl.textContent = 'تم اختيار الصورة ✓';
      };
      img.onerror = ()=>{ statusEl.textContent = 'تعذر قراءة الصورة'; };
      img.src = e.target.result;
    };
    reader.onerror = ()=>{ statusEl.textContent = 'تعذر رفع الصورة'; };
    reader.readAsDataURL(file);
  });
  root.querySelectorAll('.pf-color').forEach(el=>el.addEventListener('click', ()=>{
    const c = el.dataset.pfColor;
    if(selColors.has(c)) selColors.delete(c); else selColors.add(c);
    el.classList.toggle('active');
  }));
  root.querySelectorAll('.pf-size').forEach(el=>el.addEventListener('click', ()=>{
    const s = el.dataset.pfSize;
    const input = root.querySelector(`[data-pf-stock="${s}"]`);
    if(selSizes.has(s)){ selSizes.delete(s); input.disabled=true; } else { selSizes.add(s); input.disabled=false; }
    el.classList.toggle('active');
  }));
  root.querySelector('[data-save-product]').addEventListener('click', async ()=>{
    const name = document.getElementById('pf-name').value.trim();
    const price = Number(document.getElementById('pf-price').value);
    const category = document.getElementById('pf-category').value;
    const occasion = document.getElementById('pf-occasion').value;
    const image = uploadedImage || document.getElementById('pf-image').value.trim() || 'https://picsum.photos/seed/'+Math.random()+'/600/750';
    const desc = document.getElementById('pf-desc').value.trim();
    if(!name || !price || selColors.size===0 || selSizes.size===0){
      document.getElementById('pf-error').textContent = 'الرجاء تعبئة الاسم والسعر واختيار لون ومقاس واحد على الأقل';
      return;
    }
    const stock = {};
    selSizes.forEach(s=>{
      const val = Number(root.querySelector(`[data-pf-stock="${s}"]`).value) || 0;
      stock[s]=val;
    });
    const productDoc = {
      id: p.id || uid('P'), name, price, category, occasion,
      images:[image], desc, colors:[...selColors], sizes:[...selSizes], stock
    };
    try{
      await saveProduct(productDoc);
    }catch(e){
      console.error(e);
      document.getElementById('pf-error').textContent = 'تعذر الحفظ — تحققي من إعداد Firebase واتصال الإنترنت';
      return;
    }
    closeModal();
    showToast(p.id?'تم حفظ التعديلات':'تمت إضافة المنتج بنجاح');
    render();
  });
}

/* ---- Admin: Wallet ---- */
function renderAdminWallet(){
  const orders = state.data.orders;
  const delivered = orders.filter(o=>o.status==='تم التسليم');
  const pendingOrders = orders.filter(o=>o.status!=='تم التسليم' && o.status!=='ملغي');
  const totalSales = delivered.reduce((s,o)=>s+o.total,0) + pendingOrders.reduce((s,o)=>s+o.total,0);
  const commissionRate = 0.08;
  const netProfitDelivered = delivered.reduce((s,o)=>s+o.total,0) * (1-commissionRate);
  const pendingAmount = pendingOrders.reduce((s,o)=>s+o.total,0);
  const availableBalance = netProfitDelivered - (state.data.wallet.withdrawn||0);
  const avgOrder = orders.length? (orders.reduce((s,o)=>s+o.total,0)/orders.length) : 0;

  // last 7 days sales
  const days = [...Array(7)].map((_,i)=>{
    const d = new Date(); d.setDate(d.getDate()-(6-i));
    return d.toISOString().slice(0,10);
  });
  const daySums = days.map(d=> orders.filter(o=>o.date===d).reduce((s,o)=>s+o.total,0));
  const maxDay = Math.max(...daySums, 1);

  const transactions = state.data.wallet.transactions.slice(0,15);

  return `
  <div class="admin-topbar"><h2>المحفظة المالية</h2></div>
  <div class="wallet-cards">
    <div class="wallet-card balance"><div class="label">الرصيد القابل للسحب</div><div class="amount">${fmt(Math.max(availableBalance,0))}</div></div>
    <div class="wallet-card pending"><div class="label">أموال معلقة (طلبات لم تُسلَّم بعد)</div><div class="amount">${fmt(pendingAmount)}</div></div>
    <div class="wallet-card withdrawn"><div class="label">إجمالي المسحوبات</div><div class="amount">${fmt(state.data.wallet.withdrawn||0)}</div></div>
  </div>
  <div class="stat-grid">
    <div class="stat-card"><div class="label">إجمالي المبيعات</div><div class="value">${fmt(totalSales)}</div></div>
    <div class="stat-card"><div class="label">صافي الأرباح (بعد عمولة ${commissionRate*100}%)</div><div class="value">${fmt(netProfitDelivered)}</div></div>
    <div class="stat-card"><div class="label">متوسط قيمة الطلب</div><div class="value">${fmt(avgOrder)}</div></div>
    <div class="stat-card"><div class="label">عدد الطلبات</div><div class="value">${orders.length}</div></div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>المبيعات خلال آخر 7 أيام</h3></div>
    <div class="bar-chart">
      ${daySums.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.max((v/maxDay)*100,3)}%"></div><div class="lbl">${days[i].slice(5)}</div></div>`).join('')}
    </div>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>طلب سحب أرباح</h3></div>
    <div class="form-row" style="align-items:end;">
      <div class="form-group"><label>المبلغ (د.م.)</label><input id="wd-amount" type="number" placeholder="0"></div>
      <div class="form-group"><label>الحساب البنكي / المحفظة الإلكترونية</label><input id="wd-account" placeholder="RIB أو رقم المحفظة"></div>
    </div>
    <div id="wd-error" class="err"></div>
    <button class="btn btn-wine btn-sm" data-request-withdraw="1">تأكيد طلب السحب</button>
  </div>
  <div class="panel">
    <div class="panel-head"><h3>سجل المعاملات</h3></div>
    <table class="data-table">
      <thead><tr><th>التاريخ</th><th>النوع</th><th>المبلغ</th><th>ملاحظة</th></tr></thead>
      <tbody>
        ${transactions.map(t=>`
          <tr>
            <td>${t.date}</td>
            <td>${t.type}</td>
            <td style="color:${t.type.includes('سحب')?'var(--danger)':'var(--success)'};">${t.type.includes('سحب')?'-':'+'}${fmt(t.amount)}</td>
            <td>${t.note}</td>
          </tr>`).join('') || `<tr class="empty-row"><td colspan="4">لا توجد معاملات بعد</td></tr>`}
      </tbody>
    </table>
  </div>`;
}

  if(wdBtn) wdBtn.addEventListener('click', async ()=>{

    const account = document.getElementById('wd-account').value.trim();

      document.getElementById('wd-error').textContent = 'الرجاء إدخال مبلغ صحيح وبيانات الحساب';
      return;
    }
    await setWithdrawn((state.data.wallet.withdrawn||0) + amount);
    await addWalletTx({id:uid('TX'), date:todayISO(), createdAt:Date.now(), type:'طلب سحب', amount, note:`تحويل إلى: ${account}`});
    showToast('تم إرسال طلب السحب بنجاح');
    render();
  });
}

/* ============ INIT ============ */
(async function init(){
  const app = document.getElementById('app');
  if(!FIREBASE_READY){
    app.innerHTML = `<div style="max-width:600px; margin:80px auto; text-align:center; padding:30px;">
      <span style="font-size:40px;">⚙️</span>
      <h2 style="color:var(--wine); margin:14px 0 10px;">يلزم إعداد Firebase أولاً</h2>
      <p style="color:#7A6A6E; font-size:14px; line-height:1.8;">
        افتحي كود الصفحة (Ctrl/Cmd+F عن FIREBASE_CONFIG) وضعي بيانات مشروعك من Firebase Console.
        راجعي تعليمات الإعداد المرفقة مع الملف.
      </p>
    </div>`;
    return;
  }
  app.innerHTML = `<div style="padding:80px; text-align:center; color:#7A6A6E;">جاري تحميل المتجر...</div>`;
  try{ const redirectResult = await auth.getRedirectResult(); if(redirectResult && redirectResult.user) await checkAdminEmail(redirectResult.user); }catch(e){ console.error(e); }
  auth.onAuthStateChanged(async user=>{
    if(user && (!user.email || !ADMIN_EMAILS.includes(user.email.toLowerCase()))){
      auth.signOut();
      state.isAdmin = false;
      return;
    }
    state.isAdmin = !!user;
    if(user && state.view==='admin-login') state.adminTab='products';
    render();
  });
  await loadData();
  if(window.location.hash === '#admin'){ state.view = 'admin-login'; }
  window.addEventListener('hashchange', ()=>{
    if(window.location.hash === '#admin'){ state.view = 'admin-login'; render(); }
  });
  render();
})();
</script>
